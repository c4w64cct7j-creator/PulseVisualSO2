name: Build Pulse Visual SO2 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android project
        run: |
          unzip PulseVisualSO2-Android-Prototype.zip -d source
          test -f source/PulseVisualSO2/app/build.gradle

      - name: Make gradlew executable
        run: |
          cd source/PulseVisualSO2
          chmod +x gradlew || true

      - name: Build debug APK
        run: |
          cd source/PulseVisualSO2
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseVisualSO2-debug-apk
          path: source/PulseVisualSO2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
